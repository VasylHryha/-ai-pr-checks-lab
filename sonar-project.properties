sonar.organization=vasylhryha
sonar.projectKey=VasylHryha_-ai-pr-checks-lab
sonar.host.url=https://sonarcloud.io

# Sources
sonar.sources=src

# Tests live under src/**/__tests__/
sonar.tests=src
sonar.test.inclusions=**/__tests__/**/*.{test,spec}.{ts,js}

# Coverage (produced by Vitest)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
